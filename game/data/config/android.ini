# PROJECT: REAL JAPAN — Android defaults (read after default.ini, before your own settings).
# A phone draws 720 lines (scaled up to the panel), a shorter view distance and no post effects;
# all of it can be changed in the settings screen (render_height only here: 0 = the panel's own).
render_height = 720
view_distance_m = 800
post_fx = 0
shadows = 1
vsync = 1
